name: Refresh released documentation

# Main pushes already deploy through the repository's Netlify Git integration.
# Backport this workflow to each supported release branch: push workflows are
# loaded from the pushed branch. The helper itself always comes from main.
on:
  push:
    branches: ['release-*']
    paths:
      - 'site/**'
      - 'docs/**'
      - 'hack/releasing/**'
      - '.github/workflows/docs-release-refresh.yaml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: released-documentation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Read the current documentation tooling
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Refresh the combined production site
        env:
          NETLIFY_DOCS_BUILD_HOOK: ${{ secrets.NETLIFY_DOCS_BUILD_HOOK }}
        run: python3 hack/releasing/trigger-docs-build.py --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"
