name: Metadata protection
on:
  pull_request: {}
  push: {}
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes: ["1.30.0", "1.37.0"]
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
    - name: Check manifest renderers
      run: |
        helm version --short
        make kustomize
    - name: Exercise installed policy against a temporary API server
      env:
        LWS_METADATA_TEST_K8S_VERSION: ${{ matrix.kubernetes }}
        KUSTOMIZE: ${{ github.workspace }}/bin/kustomize
      run: go test -v -count=1 -timeout=10m ./test/integration/metadataprotection
