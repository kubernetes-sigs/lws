  names:
    kind: DisaggregatedSetRoleScaler
    listKind: DisaggregatedSetRoleScalerList
    plural: disaggregatedsetrolescalers
    shortNames:
      - dsrs
    singular: disaggregatedsetrolescaler
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.replicas
          name: Desired
          type: integer
        - jsonPath: .status.replicas
          name: Current
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1
      schema:
        openAPIV3Schema:
          description: |-
            DisaggregatedSetRoleScaler exposes the /scale subresource for a single role
            of a DisaggregatedSet. Instances are auto-created by the DisaggregatedSet
            controller for every role with scaling.mode: External and are named
            "<disaggregatedset>-<role>". External autoscalers (HPA, KEDA, or any
            /scale-aware controller) write spec.replicas; the DisaggregatedSet controller
            reads it and drives the role's LeaderWorkerSet.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                DisaggregatedSetRoleScalerSpec is the desired state written by an external
                autoscaler via the /scale subresource. The (DS, role) association is derived
                from the scaler's controller ownerReference and its role label.
              properties:
                replicas:
                  description: |-
                    Replicas is the desired replica count for the role. Nil means no
                    autoscaler has written yet; the controller reports WaitingForScaler and
                    holds the LWS at 0 (fresh role) or at its current count (previously
                    Static role).
                  format: int32
                  minimum: 0
                  type: integer
              type: object
            status:
              description: |-
                DisaggregatedSetRoleScalerStatus is the observed state written back by the
                DisaggregatedSet controller.
              properties:
                conditions:
                  description: Conditions expose scaler-level state (Ready).
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the .metadata.generation the status reflects.
                  format: int64
                  type: integer
                replicas:
                  description: |-
                    Replicas is the observed pod count for this role, aggregated across all
                    revisions currently present. Read by HPA as the "current" replica count.
                  format: int32
                  type: integer
                selector:
                  description: |-
                    Selector is a label selector (in string form) matching all pods for this
                    role across all revisions:
                      disaggregatedset.x-k8s.io/name=<ds>,disaggregatedset.x-k8s.io/role=<role>
                    Aggregate (revision-agnostic) so HPA sees the actual serving fleet during
                    a rolling update.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
