apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: lws-mutating-webhook-configuration
{{ if .Values.enableCertManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/lws-serving-cert
{{ end }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: lws-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-leaderworkerset-x-k8s-io-v1-leaderworkerset
    failurePolicy: Fail
    name: mleaderworkerset.kb.io
    rules:
      - apiGroups:
          - leaderworkerset.x-k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - leaderworkersets
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: lws-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate--v1-pod
    failurePolicy: Fail
    name: mpod.kb.io
    objectSelector:
      matchExpressions:
        - key: leaderworkerset.sigs.k8s.io/name
          operator: Exists
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: lws-validating-webhook-configuration
{{ if .Values.enableCertManager }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/lws-serving-cert
{{ end }}
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: lws-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-leaderworkerset-x-k8s-io-v1-leaderworkerset
    failurePolicy: Fail
    name: vleaderworkerset.kb.io
    rules:
      - apiGroups:
          - leaderworkerset.x-k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - leaderworkersets
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: lws-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate--v1-pod
    failurePolicy: Fail
    name: vpod.kb.io
    objectSelector:
      matchExpressions:
        - key: leaderworkerset.sigs.k8s.io/name
          operator: Exists
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    sideEffects: None
  {{- if .Values.enableDisaggregatedSet }}
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: lws-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-disaggregatedset-x-k8s-io-v1-disaggregatedset
    failurePolicy: Fail
    name: vdisaggregatedset.kb.io
    rules:
      - apiGroups:
          - disaggregatedset.x-k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - disaggregatedsets
    sideEffects: None
  {{- end }}
