suite: DisaggregatedSet editor, viewer, and admin ClusterRoles
templates:
  - templates/rbac/disaggregatedset_editor_role.yaml
  - templates/rbac/disaggregatedset_viewer_role.yaml
  - templates/rbac/disaggregatedset_admin_role.yaml
release:
  name: lws
  namespace: lws-system
tests:
  - it: renders each ClusterRole by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRole

  - it: renders no ClusterRoles when disabled
    set:
      enableDisaggregatedSet: false
    asserts:
      - hasDocuments:
          count: 0
