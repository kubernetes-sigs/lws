suite: controller manager configuration
templates:
  - templates/manager/configmap.yaml
release:
  name: lws
  namespace: lws-system
tests:
  - it: renders only the base configuration by default
    asserts:
      - equal:
          path: data["controller_manager_config.yaml"]
          value: |
            apiVersion: config.lws.x-k8s.io/v1
            kind: Configuration
            leaderElection:
              leaderElect: true
            internalCertManagement:
              enable: true

  - it: enables internal certificate management without cert-manager
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "(?m)^internalCertManagement:\\n  enable: true$"

  - it: disables internal certificate management with cert-manager
    set:
      enableCertManager: true
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "(?m)^internalCertManagement:\\n  enable: false$"

  - it: renders feature gates when set
    set:
      featureGates:
        WorkloadAwareScheduling: true
    asserts:
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: "(?m)^featureGates:\\n  WorkloadAwareScheduling: true$"
