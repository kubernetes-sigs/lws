suite: controller manager service account
templates:
  - templates/manager/deployment.yaml
  - templates/rbac/service_account.yaml
  - templates/rbac/role_binding.yaml
  - templates/rbac/leader_election_role_binding.yaml
  - templates/rbac/clusterrolebinding.yaml
release:
  name: lws
  namespace: lws-system
tests:
  - it: names the service account after the release by default
    template: templates/rbac/service_account.yaml
    asserts:
      - equal:
          path: metadata.name
          value: lws-controller-manager

  - it: uses serviceAccount.name for the service account
    template: templates/rbac/service_account.yaml
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: runs the manager as serviceAccount.name
    template: templates/manager/deployment.yaml
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa

  - it: binds the manager ClusterRole to serviceAccount.name
    template: templates/rbac/role_binding.yaml
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: custom-sa
              namespace: lws-system

  - it: binds the leader election Role to serviceAccount.name
    template: templates/rbac/leader_election_role_binding.yaml
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: custom-sa
              namespace: lws-system

  - it: binds the proxy ClusterRole to serviceAccount.name
    template: templates/rbac/clusterrolebinding.yaml
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: custom-sa
              namespace: lws-system
