suite: admission webhook configurations
templates:
  - templates/webhook/webhook.yaml
release:
  name: lws
  namespace: lws-system
tests:
  - it: adds the DisaggregatedSet validating webhook by default
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    asserts:
      - lengthEqual:
          path: webhooks
          count: 3
      - contains:
          path: webhooks
          content:
            name: vdisaggregatedset.kb.io
            clientConfig:
              service:
                name: lws-webhook-service
                namespace: lws-system
                path: /validate-disaggregatedset-x-k8s-io-v1-disaggregatedset
          any: true

  - it: omits the DisaggregatedSet validating webhook when disabled
    set:
      enableDisaggregatedSet: false
    documentSelector:
      path: kind
      value: ValidatingWebhookConfiguration
    asserts:
      - lengthEqual:
          path: webhooks
          count: 2
      - notContains:
          path: webhooks
          content:
            name: vdisaggregatedset.kb.io
          any: true
