# Default values for lws.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""
enablePrometheus: false
serviceMonitor:
  extraLabels: {}
  # Example override:
  #   extraLabels:
  #     release: my-prometheus-sm-selector
enableCertManager: false
# enableDisaggregatedSet installs the DisaggregatedSet editor/viewer/admin
# ClusterRoles and the validating webhook. The CRD (under crds/), the
# bundled controller, and its manager RBAC are always installed.
enableDisaggregatedSet: false
# replicaCount above 1 runs standby managers: leader election keeps a single
# active reconciler, while every replica serves the webhooks.
replicaCount: 1
serviceAccount:
  # name of the controller manager ServiceAccount. Defaults to
  # <fullname>-controller-manager when empty.
  name: ""
# PodDisruptionBudget for the manager Deployment, rendered only when
# replicaCount is greater than 1.
# Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
pdb:
  # Enable PodDisruptionBudget.
  enabled: true
  # Minimum pods that must remain available after eviction (int or quoted percent).
  minAvailable: 1
  # Maximum pods that may be unavailable (int or quoted percent). Rendered only
  # when set, and takes precedence over minAvailable.
  maxUnavailable: null
  # When manager pods that are not Ready may be evicted: AlwaysAllow or
  # IfHealthyBudget. Set to null to use the cluster default (IfHealthyBudget).
  unhealthyPodEvictionPolicy: AlwaysAllow
imagePullSecrets: []
# Customize controlerManager
image:
  manager:
    repository: registry.k8s.io/lws/lws
    # tag, if defined will use the given image tag, else Chart.AppVersion will be used
    tag: main
    pullPolicy: Always
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000
service:
  type: ClusterIP
  port: 9443
resources:
  requests:
    cpu: 1
    memory: 1Gi
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
# gangSchedulingManagement is configuration for gang scheduling management.
# For example:
# gangSchedulingManagement:
#   schedulerProvider: volcano
gangSchedulingManagement: {}
# Alpha LWS feature gates. WorkloadAwareScheduling is disabled by default.
featureGates: {}
