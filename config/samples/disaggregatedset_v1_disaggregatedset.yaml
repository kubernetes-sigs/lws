apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: disaggregatedset-sample
  namespace: default
spec:
  slices: 2
  # placementPolicy co-locates each slice's roles in one topology domain and spreads
  # this DisaggregatedSet's slices across domains. Requires nodes labeled with the
  # topology key. Uncomment to enable (ExclusiveTopology also excludes other
  # DisaggregatedSets' slices from a domain).
  # placementPolicy:
  #   type: ExclusiveSlice        # None | ExclusiveSlice | ExclusiveTopology
  #   topology: cloud.google.com/gke-nodepool
  roles:
    - name: prefill
      spec:
        replicas: 2
        leaderWorkerTemplate:
          size: 1
          leaderTemplate:
            metadata:
              labels:
                role: prefill
            spec:
              containers:
                - name: worker
                  image: nginx:latest
                  ports:
                    - containerPort: 80
          workerTemplate:
            metadata:
              labels:
                role: prefill
            spec:
              containers:
                - name: worker
                  image: nginx:latest
                  ports:
                    - containerPort: 80
    - name: decode
      spec:
        replicas: 2
        leaderWorkerTemplate:
          size: 1
          leaderTemplate:
            metadata:
              labels:
                role: decode
            spec:
              containers:
                - name: worker
                  image: nginx:latest
                  ports:
                    - containerPort: 80
          workerTemplate:
            metadata:
              labels:
                role: decode
            spec:
              containers:
                - name: worker
                  image: nginx:latest
                  ports:
                    - containerPort: 80
