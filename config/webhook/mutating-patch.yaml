# Positional index, not name-based — see the comment in validating-patch.yaml.
# Currently correct: manifests.yaml only has [mleaderworkerset, mpod] here, so
# mpod.kb.io really is index 1. Re-verify after any controller-gen bump.
- op: replace
  path: /webhooks/1
  value:
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /mutate--v1-pod
    failurePolicy: Fail
    name: mpod.kb.io
    objectSelector:
      matchExpressions:
      - key: leaderworkerset.sigs.k8s.io/name
        operator: Exists
    rules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
    sideEffects: None
