# DisaggregatedSet + Kueue topology-aware scheduling: vLLM.
# Requires Kueue with TAS and a LocalQueue named "default" (see the guide).
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: vllm-disagg
  labels:
    # Admit this workload through Kueue.
    kueue.x-k8s.io/queue-name: default
spec:
  roles:
    - name: prefill
      spec:
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                role: prefill
              annotations:
                # Co-locate the prefill role within one topology block.
                # Set the value to your topology level's node label.
                kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
            spec:
              containers:
                - name: vllm
                  image: vllm/vllm-openai:v0.28.0 # pinned; bump to the latest release
                  env:
                    - name: HF_TOKEN
                      value: $HF_TOKEN
                  command:
                    - sh
                    - -c
                    - "python3 -m vllm.entrypoints.openai.api_server --port 8080
                       --model meta-llama/Meta-Llama-3.1-8B-Instruct
                       --kv-transfer-config '{\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_producer\"}'"
                  resources:
                    limits:
                      nvidia.com/gpu: "1"
                  ports:
                    - containerPort: 8080
                  readinessProbe:
                    tcpSocket:
                      port: 8080
                    initialDelaySeconds: 15
                    periodSeconds: 10
    - name: decode
      spec:
        leaderWorkerTemplate:
          size: 1
          workerTemplate:
            metadata:
              labels:
                role: decode
              annotations:
                # Co-locate the decode role within one topology block.
                kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
            spec:
              containers:
                - name: vllm
                  image: vllm/vllm-openai:v0.28.0 # pinned; bump to the latest release
                  env:
                    - name: HF_TOKEN
                      value: $HF_TOKEN
                  command:
                    - sh
                    - -c
                    - "python3 -m vllm.entrypoints.openai.api_server --port 8080
                       --model meta-llama/Meta-Llama-3.1-8B-Instruct
                       --kv-transfer-config '{\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_consumer\"}'"
                  resources:
                    limits:
                      nvidia.com/gpu: "1"
                  ports:
                    - containerPort: 8080
                  readinessProbe:
                    tcpSocket:
                      port: 8080
                    initialDelaySeconds: 15
                    periodSeconds: 10
