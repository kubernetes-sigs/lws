[build]
  base = "site"
  publish = "public"
  command = "npm ci && npm run test:integration && python3 ../hack/releasing/snapshot-docs.py && npm run build:html"

[context.deploy-preview]
  command = "npm ci && npm run test:integration && python3 ../hack/releasing/snapshot-docs.py --main-ref HEAD && npm run build:html"

[context.branch-deploy]
  command = "npm ci && npm run test:integration && python3 ../hack/releasing/snapshot-docs.py --main-ref HEAD && npm run build:html"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.152.2"

[context.production.environment]
  HUGO_VERSION = "0.152.2"
  HUGO_ENV = "production"

[context.branch-deploy.environment]
  HUGO_VERSION = "0.152.2"
