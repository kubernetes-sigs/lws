apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../../config/default

components:
- ../../../../config/components/computedomain

configMapGenerator:
- name: lws-manager-config
  namespace: lws-system
  behavior: merge
  files:
  - controller_manager_config.yaml

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: controller-manager
      namespace: system
    spec:
      template:
        spec:
          containers:
          - name: manager
            imagePullPolicy: IfNotPresent
